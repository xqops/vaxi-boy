<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d1b2e">
<title>Vaxi Boy</title>
<meta name="description" content="Jogo de exploração em que cada vacina tomada de verdade abre uma nova área do mundo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
:root {
  --ink: #1d1b2e;
  --paper: #fbf3df;
  --paper-line: #e8dcbf;
  --cream: #fff8e8;
  --cover: #24468f;
  --accent: #ffcf3f;
  --ok: #2f9e6a;
  --warn: #e0663a;
  --ui: #3f8f3c;
  --f-pix: 'Silkscreen', 'Courier New', monospace;
  --f-body: 'Pixelify Sans', 'Trebuchet MS', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #1d1b2e; } }
:root[data-theme="dark"] { --ink: #1d1b2e; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--f-body); }
body { background-color: #2a2350; background-image: radial-gradient(#3a3170 2px, transparent 2.6px); background-size: 24px 24px; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }

/* ---------- console VAXI BOY ---------- */
.wrap { position: fixed; inset: 0; display: grid; place-items: center; }
.stage { position: relative; }
.console { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 380px; height: 720px;
  background: linear-gradient(165deg, #9ff0d6, #6fd6bb 45%, #4fbfa3);
  border-radius: 22px 22px 84px 22px;
  box-shadow: inset 5px 5px 0 rgba(255,255,255,.45), inset -7px -9px 0 rgba(0,0,0,.14), 0 24px 48px rgba(10,6,30,.55); }
.console::before { content: ''; position: absolute; left: 22px; right: 22px; top: 8px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.08); }
.bezel { position: absolute; left: 14px; top: 20px; right: 14px; height: calc(var(--sh) + 44px); background: #2c2a44; border-radius: 12px 12px 48px 12px; box-shadow: inset 0 3px 0 rgba(255,255,255,.1), inset 0 -4px 0 rgba(0,0,0,.3); }
.blbl { position: absolute; left: 34px; right: 22px; top: 8px; display: flex; align-items: center; gap: 8px; font: 700 7px/1 var(--f-pix); color: #c9c4ef; letter-spacing: .1em; white-space: nowrap; }
.blbl::before, .blbl::after { content: ''; flex: 1; height: 6px; background: linear-gradient(#ff7a6b 0 2px, transparent 2px 4px, #ffcf3f 4px); }
.led { position: absolute; left: 14px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: #ff5a5a; box-shadow: 0 0 8px #ff5a5a; }
#game { position: absolute; left: 16px; top: 24px; right: 16px; height: var(--sh); overflow: hidden; border-radius: 4px; background: #1d1b2e; container-type: size; box-shadow: inset 0 0 0 2px rgba(0,0,0,.4); }
.brand { position: absolute; left: 26px; bottom: 258px; color: #1f4f5c; display: flex; flex-direction: column; gap: 4px; }
.brand small { font: 700 10px/1 var(--f-pix); letter-spacing: .16em; }
.brand b { font: 700 30px/1 var(--f-pix); transform: skewX(-10deg); transform-origin: left; letter-spacing: .02em; color: #fff; text-shadow: 3px 3px 0 #1f4f5c; }
.dpad { position: absolute; left: 30px; bottom: 102px; width: 112px; height: 112px; touch-action: none; cursor: pointer; }
.dpad i { position: absolute; background: #2c2a44; border-radius: 5px; box-shadow: 0 5px 0 #17152a; }
.dpad .h { left: 0; top: 38px; width: 112px; height: 36px; }
.dpad .v { left: 38px; top: 0; width: 36px; height: 112px; }
.dpad .c { left: 47px; top: 47px; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(#25233a, #3c3a58); box-shadow: none; }
.dpad .t { width: 0; height: 0; background: none; box-shadow: none; border: 7px solid transparent; border-radius: 0; }
.dpad .t.u { left: 49px; top: 9px; border-bottom-color: #6a6790; border-top: 0; }
.dpad .t.d { left: 49px; bottom: 9px; border-top-color: #6a6790; border-bottom: 0; }
.dpad .t.l { top: 49px; left: 9px; border-right-color: #6a6790; border-left: 0; }
.dpad .t.r { top: 49px; right: 9px; border-left-color: #6a6790; border-right: 0; }
.dpad.p-UP { transform: perspective(240px) rotateX(10deg); } .dpad.p-DOWN { transform: perspective(240px) rotateX(-10deg); }
.dpad.p-LEFT { transform: perspective(240px) rotateY(-10deg); } .dpad.p-RIGHT { transform: perspective(240px) rotateY(10deg); }
.ab { position: absolute; right: 18px; bottom: 112px; width: 160px; height: 96px; transform: rotate(-24deg); }
.ab::before { content: ''; position: absolute; left: -6px; top: 18px; width: 170px; height: 66px; border-radius: 33px; background: rgba(0,0,0,.08); }
.rb { position: absolute; top: 24px; width: 56px; height: 56px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: radial-gradient(circle at 36% 30%, #ff9a8a, #ff6b5b 60%); box-shadow: 0 6px 0 #b8382c; }
.rb.b { left: 6px; } .rb.a { left: 96px; }
.rb.down { transform: translateY(5px); box-shadow: 0 1px 0 #b8382c; }
.ab span { position: absolute; top: 88px; font: 700 11px/1 var(--f-pix); color: #1f4f5c; }
.ab span.b { left: 28px; } .ab span.a { left: 118px; }
.ss { position: absolute; left: 108px; bottom: 34px; display: flex; gap: 22px; transform: rotate(-24deg); }
.ss div { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.pill { width: 50px; height: 14px; border-radius: 8px; border: 0; padding: 0; cursor: pointer; background: #2c2a44; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), 0 0 0 3px rgba(0,0,0,.07); }
.pill.down { background: #45426a; }
.ss span { font: 700 7px/1 var(--f-pix); color: #1f4f5c; letter-spacing: .08em; }
.grill { position: absolute; right: 38px; bottom: 34px; display: flex; gap: 8px; transform: rotate(-28deg); }
.grill i { width: 6px; height: 58px; border-radius: 3px; background: #3fa58b; box-shadow: inset 1px 2px 0 rgba(0,0,0,.25); }
/* deitado: tela no meio, controles nas laterais */
.console.land { border-radius: 40px; }
.console.land .bezel { left: 190px; right: auto; width: 460px; top: 16px; height: calc(var(--sh) + 40px); border-radius: 12px; }
.console.land .brand { left: 30px; top: 36px; bottom: auto; }
.console.land .brand b { font-size: 17px; }
.console.land .brand small { font-size: 8px; }
.console.land .dpad { left: 40px; top: 170px; bottom: auto; }
.console.land .ab { right: 4px; top: 150px; bottom: auto; }
.console.land .ss { left: auto; right: 34px; bottom: 34px; transform: none; }
.console.land .grill { right: auto; left: 54px; bottom: 30px; transform: none; }
.console.land .grill i { height: 34px; }
#game :focus-visible, .console button:focus-visible { outline: 3px solid #ffcf3f; outline-offset: 2px; }
#cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#hud.hide > * { display: none; }
.chip { background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.35); border-radius: 6px; }
.hud-l { position: absolute; left: 6px; top: 6px; padding: 4px 8px 5px; max-width: 62%; display: flex; flex-direction: column; gap: 1px; }
.hud-l b { font: 700 9px/1.1 var(--f-pix); letter-spacing: .04em; color: var(--ui); }
.hud-l span { font: 500 12px/1.15 var(--f-body); }
.hud-r { position: absolute; right: 6px; top: 6px; display: flex; gap: 4px; pointer-events: auto; }
.chip { border-width: 2px; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.hbtn { height: 30px; min-width: 30px; padding: 0 6px; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font: 700 10px/1 var(--f-pix); }
.hbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.hbtn svg { width: 16px; height: 16px; display: block; }
.toast { position: absolute; left: 50%; top: 46px; transform: translateX(-50%); padding: 5px 10px 6px; font: 600 13px/1.2 var(--f-body); white-space: nowrap; max-width: 94%; overflow: hidden; text-overflow: ellipsis; animation: tin .25s steps(3); }
@keyframes tin { from { transform: translate(-50%, -12px); opacity: 0; } }
.banner { position: absolute; left: 50%; top: 26%; transform: translateX(-50%); text-align: center; padding: 10px 18px 12px; color: #fff; background: var(--ui); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.4); animation: bin 2.6s steps(12) forwards; white-space: nowrap; }
.banner small { display: block; font: 700 10px/1.2 var(--f-pix); letter-spacing: .12em; opacity: .85; }
.banner b { display: block; font: 700 16px/1.2 var(--f-pix); }
@keyframes bin { 0% { opacity: 0; transform: translate(-50%, 10px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* ---------- UI layers ---------- */
#ui { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#ui > * { pointer-events: auto; }
.dlg { position: absolute; left: 6px; right: 6px; bottom: 6px; min-height: 84px; max-height: calc(100% - 12px); overflow: auto; display: flex; gap: 8px; padding: 8px 10px 12px; background: var(--cream); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.4); cursor: pointer; }
.dlg .por { flex: none; width: 46px; height: 46px; background: var(--paper-line); border: 2px solid var(--ink); border-radius: 5px; display: grid; place-items: center; align-self: flex-start; }
.dlg .por canvas { width: 32px; height: 32px; }
.dlg .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.dlg .who { font: 700 9px/1.1 var(--f-pix); letter-spacing: .06em; color: var(--ui); }
.dlg .tx { font: 500 15px/1.3 var(--f-body); min-height: 38px; overflow-wrap: break-word; }
.dlg .tx b { color: var(--ui); }
.dlg .nx { position: absolute; right: 12px; bottom: 6px; width: 0; height: 0; border: 7px solid transparent; border-top-color: var(--ink); border-bottom: 0; animation: blk .7s steps(1) infinite; }
@keyframes blk { 50% { visibility: hidden; } }
.opts { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
.opt { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border: 2px solid var(--ink); border-radius: 5px; background: #fff; font: 600 14px/1.2 var(--f-body); cursor: pointer; text-align: left; }
.opt::before { content: ''; flex: none; width: 0; height: 0; border-left: 8px solid transparent; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.opt.sel { background: var(--accent); }
.opt.sel::before { border-left-color: var(--ink); }
.opt.dis { opacity: .45; }

.ov { position: absolute; inset: 0; display: grid; place-items: center; padding: 6px; background: rgba(16,14,30,.72); animation: ovin .18s steps(3); }
@keyframes ovin { from { opacity: 0; } }
.card { width: 100%; max-height: 100%; overflow: auto; background: var(--cream); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 4px 0 rgba(0,0,0,.45); padding: 12px; display: flex; flex-direction: column; gap: 9px; }
.card h2 { margin: 0; font: 700 14px/1.2 var(--f-pix); letter-spacing: .03em; }
.card p { margin: 0; font: 500 15px/1.35 var(--f-body); }
.hint { font: 700 8px/1.3 var(--f-pix); letter-spacing: .06em; opacity: .7; text-align: center; }
.pbtn { align-self: center; padding: 8px 14px 9px; border: 3px solid var(--ink); border-radius: 7px; background: var(--accent); box-shadow: 0 3px 0 var(--ink); font: 700 11px/1 var(--f-pix); cursor: pointer; }
.pbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.list { display: flex; flex-direction: column; gap: 4px; }

/* title */
.title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; text-align: center; background: linear-gradient(rgba(16,14,30,.2), rgba(16,14,30,.78)); }
.logo { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; text-shadow: 0 3px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 3px 3px 0 var(--ink); }
.logo small { font: 700 9px/1 var(--f-pix); letter-spacing: .2em; color: var(--accent); }
.logo b { font: 700 clamp(30px, 13cqw, 60px)/1 var(--f-pix); letter-spacing: .02em; }
.logo span { font: 700 clamp(14px, 6cqw, 24px)/1 var(--f-pix); color: #9ff3d8; }
.title .menu { display: flex; flex-direction: column; gap: 7px; width: min(240px, 86%); }
.title .opt { justify-content: center; font: 700 11px/1.2 var(--f-pix); padding: 9px; }
.title .opt::before { display: none; }
.title .foot { font: 500 13px/1.3 var(--f-body); color: #e8e4ff; max-width: 300px; text-shadow: 0 2px 0 var(--ink); }
.duo { display: flex; gap: 16px; align-items: flex-end; }
.duo canvas { width: 48px; height: 48px; }
.duo .vs { font: 700 11px/1 var(--f-pix); color: #fff; text-shadow: 0 2px 0 var(--ink); margin-bottom: 16px; }

/* how */
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.steps li { display: flex; gap: 10px; align-items: flex-start; font: 500 16px/1.35 var(--f-body); }
.steps .n { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border: 3px solid var(--ink); border-radius: 50%; background: var(--accent); font: 700 11px/1 var(--f-pix); }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 15px/1.3 var(--f-body); }
kbd { font: 700 10px/1 var(--f-pix); background: #fff; border: 2px solid var(--ink); border-radius: 4px; padding: 3px 5px 2px; box-shadow: 0 2px 0 var(--ink); }

/* caderneta (livrinho) */
.book { width: min(620px, 100%); max-height: 100%; display: flex; flex-direction: column; border: 4px solid var(--ink); border-radius: 12px; box-shadow: 0 6px 0 rgba(0,0,0,.45); overflow: hidden; background: var(--paper); }
.cover { background: var(--cover); color: #fff; padding: 12px 16px 12px 26px; position: relative; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cover::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 6px; background: repeating-linear-gradient(#fff 0 4px, transparent 4px 10px); opacity: .5; }
.cover b { display: block; font: 700 15px/1.15 var(--f-pix); letter-spacing: .04em; }
.cover small { display: block; font: 500 13px/1.2 var(--f-body); opacity: .85; }
.cover .x { flex: none; width: 36px; height: 36px; border: 3px solid #fff; border-radius: 6px; background: transparent; color: #fff; font: 700 14px/1 var(--f-pix); cursor: pointer; }
.pg { overflow: auto; padding: 12px 14px 14px; background: repeating-linear-gradient(var(--paper) 0 23px, var(--paper-line) 23px 24px); display: flex; flex-direction: column; gap: 10px; }
.idrow { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 600 15px/1.3 var(--f-body); }
.idrow span b { font-family: var(--f-pix); font-size: 11px; letter-spacing: .04em; opacity: .7; margin-right: 4px; }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.slot { position: relative; min-height: 96px; padding: 8px 10px 10px; background: #fffdf6; border: 3px solid var(--ink); border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.slot.sel { outline: 4px solid var(--accent); outline-offset: 1px; }
.slot .nm { font: 700 12px/1.15 var(--f-pix); letter-spacing: .02em; padding-right: 22px; }
.slot .pr { font: 500 13px/1.25 var(--f-body); opacity: .8; }
.slot .ds { display: flex; gap: 4px; margin-top: auto; align-items: center; font: 700 9px/1 var(--f-pix); }
.slot .ds i { width: 11px; height: 11px; border: 2px solid var(--ink); border-radius: 50%; }
.slot .ds i.on { background: var(--ink); }
.slot .area { position: absolute; right: 8px; top: 8px; width: 18px; height: 18px; }
.slot .tag { align-self: flex-start; font: 700 9px/1 var(--f-pix); padding: 3px 5px 2px; border-radius: 3px; background: var(--warn); color: #fff; }
.stamp { position: absolute; right: 6px; bottom: 6px; width: 78px; height: 78px; border-radius: 50%; border: 3px solid currentColor; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(-14deg); opacity: .82; pointer-events: none; mix-blend-mode: multiply; }
.stamp::before { content: ''; position: absolute; inset: 4px; border: 1.5px dashed currentColor; border-radius: 50%; }
.stamp b { font: 700 9px/1.1 var(--f-pix); letter-spacing: .04em; }
.stamp small { font: 600 11px/1.1 var(--f-body); }
.stamp.part { border-style: dashed; opacity: .6; }
.stamp.pop { animation: stp .4s steps(4); }
@keyframes stp { from { transform: rotate(-14deg) scale(1.8); opacity: 0; } }
.detail { border: 3px solid var(--ink); border-radius: 8px; background: #fffdf6; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.detail h3 { margin: 0; font: 700 14px/1.2 var(--f-pix); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font: 500 15px/1.3 var(--f-body); }
.kv dt { font: 700 10px/1.6 var(--f-pix); opacity: .7; }
.kv dd { margin: 0; }

/* mapa */
.mapwrap { position: relative; border: 3px solid var(--ink); border-radius: 6px; overflow: hidden; background: #1d1b2e; }
.mapwrap canvas { display: block; width: 100%; height: auto; }
.mlab { position: absolute; transform: translate(-50%, -50%); font: 700 9px/1.1 var(--f-pix); color: #fff; text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; text-align: center; white-space: nowrap; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 14px/1.3 var(--f-body); }
.legend i { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--ink); margin-right: 5px; vertical-align: -1px; }

/* NFC */
.app { background: #e9fbf6; }
.apphead { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin: -16px -16px 0; background: #1fa39a; color: #fff; border-bottom: 4px solid var(--ink); }
.apphead b { font: 700 13px/1.1 var(--f-pix); }
.apphead small { font: 500 12px/1.2 var(--f-body); opacity: .9; display: block; }
.vopt { display: flex; align-items: center; gap: 8px; }
.vopt .r { margin-left: auto; font: 700 9px/1 var(--f-pix); opacity: .75; }
.tap { position: relative; height: 170px; border: 3px dashed var(--ink); border-radius: 10px; background: #fff; overflow: hidden; }
.phone { position: absolute; top: 28px; width: 70px; height: 122px; border: 4px solid var(--ink); border-radius: 12px; background: #2d2b45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #fff; font: 700 8px/1.1 var(--f-pix); text-align: center; padding: 6px; }
.phone .scr { width: 100%; flex: 1; border-radius: 4px; display: grid; place-items: center; font: 700 9px/1.2 var(--f-pix); }
.phone.l { left: 14%; animation: ml 1.1s steps(8) forwards; }
.phone.l .scr { background: #1fa39a; }
.phone.r { right: 14%; animation: mr 1.1s steps(8) forwards; }
.phone.r .scr { background: var(--cover); }
@keyframes ml { to { left: calc(50% - 72px); } }
@keyframes mr { to { right: calc(50% - 72px); } }
.waves { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); display: flex; gap: 4px; opacity: 0; animation: wv .5s steps(2) 1.1s infinite; }
.waves i { width: 10px; height: 18px; border: 3px solid var(--ink); border-left: 0; border-radius: 0 12px 12px 0; }
@keyframes wv { 0% { opacity: 1; } 50% { opacity: .2; } 100% { opacity: 1; } }
.tapmsg { text-align: center; font: 700 12px/1.3 var(--f-pix); min-height: 16px; }
.ticket { border: 3px solid var(--ink); border-radius: 8px; background: #fff; padding: 12px 14px; position: relative; display: flex; flex-direction: column; gap: 8px; }
.ticket::after { content: ''; position: absolute; left: -3px; right: -3px; bottom: -10px; height: 10px; background: radial-gradient(circle at 6px 0, transparent 5px, #fff 5.5px) 0 0 / 12px 10px repeat-x; }
.ok { display: inline-flex; align-items: center; gap: 6px; font: 700 11px/1 var(--f-pix); color: var(--ok); }
.ok::before { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--ok); box-shadow: inset 0 0 0 3px #fff; border: 2px solid var(--ok); }

/* celebração */
.cele { text-align: center; align-items: center; color: #fff; background: var(--ui); }
.cele h2 { font-size: clamp(22px, 6vw, 30px); text-shadow: 0 3px 0 var(--ink); }
.cele p { text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.cele .big { width: 96px; height: 96px; }
.cele .pbtn { color: var(--ink); }
.conf { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.conf i { position: absolute; top: -12px; width: 8px; height: 8px; animation: fall 1.8s steps(14) forwards; }

  if (c === 'G' && !isOpen(regAt(x, y))) { flow(() => gateInfo(regAt(x, y))); return true; }
  if (c === 'D') { flow(ubsDoor); return true; }
  return false;
}
function interact(x, y) {
  if (!inMap(x, y)) return;
  const n = npcAt(x, y);
  if (n) { const back = { U: 'D', D: 'U', L: 'R', R: 'L' }[P.dir]; const prev = n.dir; n.dir = back; flow(async () => { await talk(n); n.dir = prev; }); return; }
  const p = potAt(x, y);
  if (p) { flow(() => emptyPot(p)); return; }
  const c = map[y][x];
  if (c === 'S') { flow(() => readSign(x, y)); return; }
  if (c === 'G' && !isOpen(regAt(x, y))) { flow(() => gateInfo(regAt(x, y))); return; }
  if (c === 'D') { flow(ubsDoor); return; }
}

function germFree(g, x, y) {
  const r = g.r;
  if (x <= r.x0 || x >= r.x0 + 15 || y <= r.y0 || y >= r.y0 + 13) return false;
  if (TD[map[y][x]].solid || npcAt(x, y) || potAt(x, y)) return false;
  return !germs.some(o => o !== g && ((o.x === x && o.y === y) || (o.tx === x && o.ty === y)));
}
function updateGerms() {
  for (const g of germs) {
    if (g.moving) {
      const tx = g.tx * T, ty = g.ty * T, sp = g.r.speed;
      g.px += Math.sign(tx - g.px) * Math.min(sp, Math.abs(tx - g.px));
      g.py += Math.sign(ty - g.py) * Math.min(sp, Math.abs(ty - g.py));
      if (g.px === tx && g.py === ty) { g.moving = false; g.x = g.tx; g.y = g.ty; }
    } else if (g.idle > 0) g.idle--;
    else {
      const same = regAt(P.x, P.y) === g.r;
      const dP = (x, y) => Math.abs(x - P.x) + Math.abs(y - P.y);
      const opts = DIRS.map(([dx, dy]) => [g.x + dx, g.y + dy]).filter(([x, y]) => germFree(g, x, y));
      if (!opts.length) { g.idle = 20; continue; }
      let pick;
      if (same && dP(g.x, g.y) <= 4 && Math.random() < .8) { opts.sort((a, b) => dP(b[0], b[1]) - dP(a[0], a[1])); pick = opts[0]; }
      else { if (Math.random() < .35) { g.idle = 20 + Math.floor(Math.random() * 50); continue; } pick = opts[Math.floor(Math.random() * opts.length)]; }
      g.tx = pick[0]; g.ty = pick[1]; g.moving = true;
    }
    if (Math.abs(g.px - P.px) < 11 && Math.abs(g.py - P.py) < 11) catchGerm(g);
  }
}
function catchGerm(g) {
  germs = germs.filter(o => o !== g);
  const pr = progOf(g.r); if (!pr.includes(g.i)) pr.push(g.i);
  poofs.push({ x: g.px + 8, y: g.py + 8, t: 0, col: THEMES[g.r.id].germ });
  AU.catch(); save(); refreshHud();
  if (objDone(g.r)) toast('Área limpa! Agora fale com ' + g.r.gname + '.', 3000);
  else toast(`Germe neutralizado! ${pr.length}/${objTotal(g.r)}`, 1600);
}

function render() {
  ctx.fillStyle = '#1d1b2e'; ctx.fillRect(0, 0, VW, VH);
  let tx = P.px + 8 - VW / 2, ty = P.py + 8 - VH / 2;
  if (titleOn) { tx = 16 * T + Math.sin(frame / 400) * 14 * T - VW / 2; ty = 18 * T - VH / 2; }
  const maxX = MW * T - VW, maxY = MH * T - VH;
  camX = maxX > 0 ? clamp(tx, 0, maxX) : maxX / 2; camY = maxY > 0 ? clamp(ty, 0, maxY) : maxY / 2;
  const cx = Math.round(camX), cy = Math.round(camY);
  const x0 = Math.floor(cx / T), y0 = Math.floor(cy / T), x1 = Math.ceil((cx + VW) / T), y1 = Math.ceil((cy + VH) / T);
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) { if (!inMap(x, y)) continue; ctx.drawImage(tileImg(x, y), x * T - cx, y * T - cy); }
  const lit = Math.round(insCount() / 8 * houses.length);
  const draws = [];
  houses.forEach(hs => draws.push({ y: hs.y + 1, f: () => ctx.drawImage(houseImg(hs, ((hs.idx * 5) % houses.length) < lit), hs.x * T - cx, hs.y * T - cy) }));
  buildings.forEach(b => draws.push({ y: b.y + 1, f: () => ctx.drawImage(ubsImg(), b.x * T - cx, b.y * T - cy) }));
  const vis = (px, py) => px > cx - 32 && px < cx + VW + 16 && py > cy - 32 && py < cy + VH + 16;
  for (const n of npcs) if (vis(n.x * T, n.y * T)) draws.push({ y: n.y, f: () => {
    const bob = Math.floor((frame + n.x * 7) / 40) % 2;
    ctx.drawImage(person(n.look, n.dir, 0), n.x * T - cx, n.y * T - cy - bob);
    const r = n.region;
    if (r && !S.ins[r.id] && objDone(r) && isOpen(r)) bubble(n.x * T - cx + 9, n.y * T - cy - 12 - (Math.floor(frame / 15) % 2));
    if (n.id === 'ana' && !S.met.ana) bubble(n.x * T - cx + 9, n.y * T - cy - 12 - (Math.floor(frame / 15) % 2));
  } });
  for (const p of pots) if (vis(p.x * T, p.y * T)) draws.push({ y: p.y, f: () => {
    ctx.drawImage(potImg(p.full), p.x * T - cx, p.y * T - cy);
    if (p.full && frame % 50 < 25) { ctx.fillStyle = K; ctx.fillRect(p.x * T - cx + 4 + (frame % 50) / 6, p.y * T - cy - 2, 2, 1); ctx.fillRect(p.x * T - cx + 11 - (frame % 50) / 8, p.y * T - cy - 4, 2, 1); }
  } });
  for (const g of germs) if (vis(g.px, g.py)) draws.push({ y: g.py / T, f: () => ctx.drawImage(germImg(THEMES[g.r.id].germ, Math.floor(frame / 12) % 2), Math.round(g.px) - cx, Math.round(g.py) - cy - (Math.floor(frame / 8) % 2)) });
  if (S.started && !titleOn) {
    const step = P.moving ? (Math.floor((P.px + P.py) / 8) % 2 ? 1 : 2) : 0;
    draws.push({ y: P.py / T + .01, f: () => ctx.drawImage(person(LOOK.hero, P.dir, step), Math.round(P.px) - cx, Math.round(P.py) - cy) });
  }
  draws.sort((a, b) => a.y - b.y).forEach(d => d.f());
  for (const p of poofs) {
    const r = 3 + p.t / 2;
    ctx.fillStyle = p.t % 6 < 3 ? '#ffffff' : p.col;
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.fillRect(Math.round(p.x - cx + Math.cos(a) * r) - 1, Math.round(p.y - cy + Math.sin(a) * r) - 1, 3, 3); }
  }
}
function bubble(x, y) { ctx.fillStyle = K; ctx.fillRect(x - 1, y - 1, 8, 10); ctx.fillStyle = '#fff'; ctx.fillRect(x, y, 6, 8); ctx.fillStyle = '#e24b4b'; ctx.fillRect(x + 2, y + 1, 2, 4); ctx.fillRect(x + 2, y + 6, 2, 1); }

function tick() {
  frame++; if (bumpT > 0) bumpT--;
  if (!stack.length && !busy && !titleOn && S.started) { updatePlayer(); updateGerms(); }
  poofs.forEach(p => p.t++); poofs = poofs.filter(p => p.t < 24);
}
let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { tick(); acc -= 1000 / 60; }
  render(); requestAnimationFrame(loop);
}
// o console é desenhado em tamanho fixo e escalado para caber na janela
function resize() {
  const con = $('console'), stage = $('stage');
  const de = document.documentElement, vw = de.clientWidth || innerWidth, vh = de.clientHeight || innerHeight;
  const land = vw > vh * 1.15;
  con.classList.toggle('land', land);
  let W, H, sh, s;
  if (land) { W = 840; H = 440; s = clamp(Math.min((vw - 24) / W, (vh - 24) / H), .35, 2.2); sh = H - 32 - 40; }
  else { W = 380; s = clamp((vw - 16) / W, .35, 1.8); H = clamp((vh - 16) / s, 640, 940); if (H * s > vh - 16) s = (vh - 16) / H; sh = H - 372; }
  con.style.width = W + 'px'; con.style.height = H + 'px'; con.style.setProperty('--sh', sh + 'px');
  con.style.transform = `scale(${s})`; stage.style.width = W * s + 'px'; stage.style.height = H * s + 'px';
  const g = $('game');
  SC = 2; VW = Math.ceil(g.clientWidth / SC); VH = Math.ceil(g.clientHeight / SC);
  cv.width = VW; cv.height = VH; cv.style.width = VW * SC + 'px'; cv.style.height = VH * SC + 'px';
  ctx.imageSmoothingEnabled = false;
}

/* ---------- código do profissional ----------
   O profissional gera um código assinado (vacina + dose + número aleatório + verificação).
   O jogo só abre uma área com um código válido, de uso único e da dose certa.
   Nesta demonstração a "assinatura" é uma soma de verificação com chave embutida;

    S = Object.assign(fresh(), store.get(SAVE_KEY, {}));
    P.x = S.pos.x; P.y = S.pos.y; P.dir = S.pos.dir || 'D';
    if (tileSolid(P.x, P.y) || npcAt(P.x, P.y)) { P.x = 32; P.y = 18; }
    P.px = P.x * T; P.py = P.y * T; spawnEntities(); curReg = regAt(P.x, P.y); refreshHud();
    toast('Bem-vindo de volta!');
  } else await flow(newGame);
}
async function newGame() {
  S = fresh(); S.started = true;
  P.x = 32; P.y = 17; P.dir = 'R'; P.px = P.x * T; P.py = P.y * T; P.moving = false;
  spawnEntities(); curReg = null; refreshHud();
  const ana = whoOf(npcs[0]);
  await say(['Oi, seja bem-vindo à <b>Vila Imune</b>! Eu sou a Ana, enfermeira da UBS.', 'Aqui, cada vacina que você toma <b>de verdade</b> abre uma nova área do mundo.'], ana);
  const ages = [10, 11, 12, 13, 14, 15];
  const a = await choose('Primeiro: quantos anos você tem?', ages.map(x => x + ' anos'), { who: ana, cancel: false, sel: 2 });
  S.age = ages[a];
  const c = await choose('Achei sua caderneta digital! Quer importar as vacinas que você tomou quando era criança?', ['Sim, sincronizar', 'Agora não'], { who: ana, cancel: false });
  if (c === 0) await syncFlow();
  S.met.ana = 1;
  await say([
    'Cada portão da vila tem uma placa dizendo qual vacina abre aquela área.',
    'Quando você tomar uma vacina aqui na UBS, eu te mostro um <b>QR code</b> no meu app. Só com ele o portão daquela vacina abre!',
    'Use o <b>livrinho</b> no canto da tela para ver sua caderneta e o <b>mapa</b> para se localizar. Boa aventura!'], ana);
  save();
}

/* ================= INÍCIO ================= */
resize(); spawnEntities(); requestAnimationFrame(loop);
const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, wait(1500)]) : Promise.resolve();
fontsReady.then(title);
document.addEventListener('visibilitychange', () => { if (document.hidden) { held.length = 0; save(); if (AU.ctx) AU.ctx.suspend(); } else if (AU.ctx) AU.ctx.resume(); });
window.__cv = { S: () => S, P, REGIONS, map, germs: () => germs };
})();
</script>
